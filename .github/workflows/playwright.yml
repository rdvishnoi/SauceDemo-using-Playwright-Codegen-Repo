name: Playwright Regression Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Isse aap manually bhi run kar sakte hain button daba kar

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright pytest pytest-playwright pytest-html

    - name: Install Playwright Browsers
      run: playwright install --with-deps chromium

    - name: Run Tests with HTML Report & Screenshots
      run: |
        pytest test_regression.py --html=report.html --self-contained-html --screenshot=only-on-failure --video=retain-on-failure

    - name: Upload Test Report & Artifacts
      if: always() # Test paas ho ya fail, report hamesha upload hogi
      uses: actions/upload-artifact@v4
      with:
        name: playwright-test-results
        path: |
          report.html
          screenshot/
        retention-days: 7
